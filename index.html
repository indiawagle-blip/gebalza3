<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-CREW SHIFT · 맥도날드 팀 시차출근 매니저</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --mcd-red: #da291c;
      --mcd-red-dark: #b81f14;
      --mcd-yellow: #ffc72c;
      --mcd-yellow-soft: #fff6d6;
      --mcd-bg: #f9f6f0;
      --mcd-white: #ffffff;
      --mcd-black: #27251f;
      --mcd-gray: #706e6b;
      --mcd-border: #ebdccb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: var(--mcd-bg);
      color: var(--mcd-black);
      line-height: 1.5;
    }

    .mcd-font {
      font-family: 'Jua', 'Pretendard', sans-serif;
      letter-spacing: 0.5px;
    }

    /* 상단 헤더 */
    header {
      background-color: var(--mcd-red);
      color: var(--mcd-white);
      padding: 16px 24px;
      box-shadow: 0 4px 12px rgba(218, 41, 28, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    /* 좌측 상단 크루 탭 네비게이션 */
    .header-left {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .golden-arch {
      font-size: 1.6rem;
      background: var(--mcd-yellow);
      color: var(--mcd-red);
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      box-shadow: 0 3px 0 #d49f10;
    }

    .logo-text h1 {
      font-family: 'Jua', sans-serif;
      font-size: 1.3rem;
      color: var(--mcd-yellow);
      line-height: 1.1;
    }

    .logo-text span {
      font-size: 0.78rem;
      color: #ffe5e2;
      font-weight: 500;
    }

    /* 닉네임 탭 바 */
    .crew-tabs-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .crew-tab-btn {
      background: rgba(255, 255, 255, 0.18);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      padding: 5px 14px;
      border-radius: 999px;
      font-family: 'Jua', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .crew-tab-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .crew-tab-btn.active {
      background: var(--mcd-yellow);
      color: var(--mcd-red);
      border-color: #ffe066;
      box-shadow: 0 3px 0 #b38600;
      transform: translateY(-1px);
    }

    .btn-add-crew-tab {
      background: #ffffff;
      border: none;
      color: var(--mcd-red);
      padding: 5px 12px;
      border-radius: 999px;
      font-family: 'Jua', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
      transition: all 0.2s;
    }

    .btn-add-crew-tab:hover {
      background: var(--mcd-yellow-soft);
      transform: scale(1.05);
    }

    /* 우측 컨트롤 */
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .month-picker-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      padding: 5px 14px;
      border-radius: 999px;
    }

    .month-picker-wrap label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--mcd-red);
      font-family: 'Jua', sans-serif;
    }

    .month-picker-wrap input {
      border: none;
      outline: none;
      font-weight: 700;
      font-family: inherit;
      color: var(--mcd-black);
      background: transparent;
    }

    .sync-badge {
      font-size: 0.78rem;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-weight: 600;
    }

    .sync-badge.saving {
      background: var(--mcd-yellow);
      color: var(--mcd-black);
    }

    .container {
      max-width: 1120px;
      margin: 28px auto;
      padding: 0 20px;
    }

    /* 크루 대시보드 */
    .dashboard-panel {
      background: var(--mcd-white);
      border: 2px solid var(--mcd-border);
      border-radius: 20px;
      padding: 26px;
      margin-bottom: 26px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.04);
    }

    .target-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 2px dashed #f0e6d6;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .target-bar label {
      font-family: 'Jua', sans-serif;
      font-size: 1.2rem;
      color: var(--mcd-red);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .target-input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--mcd-yellow-soft);
      padding: 6px 16px;
      border-radius: 12px;
      border: 2px solid var(--mcd-yellow);
    }

    .target-input-box input {
      width: 85px;
      border: none;
      background: transparent;
      font-size: 1.4rem;
      font-weight: 800;
      text-align: right;
      color: var(--mcd-red);
      outline: none;
      font-family: 'Jua', sans-serif;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .metric-card {
      background: #faf8f5;
      border: 2px solid var(--mcd-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-card.main-burger {
      background: #fff8e8;
      border-color: var(--mcd-yellow);
    }

    .metric-card.highlight-crew {
      background: #fdeeee;
      border-color: #f7b2aa;
    }

    .metric-title {
      font-size: 0.88rem;
      color: var(--mcd-gray);
      font-weight: 700;
    }

    .metric-val {
      font-family: 'Jua', sans-serif;
      font-size: 2.1rem;
      color: var(--mcd-black);
    }

    .metric-card.main-burger .metric-val {
      color: #9c6c00;
    }

    .metric-card.highlight-crew .metric-val {
      color: var(--mcd-red);
    }

    .metric-val span {
      font-size: 1rem;
      font-weight: 500;
      font-family: 'Pretendard', sans-serif;
      color: var(--mcd-gray);
    }

    .metric-desc {
      font-size: 0.82rem;
      color: #8c8880;
      font-weight: 500;
    }

    /* 테이블 패널 */
    .table-panel {
      background: var(--mcd-white);
      border: 2px solid var(--mcd-border);
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.04);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .panel-head h2 {
      font-family: 'Jua', sans-serif;
      font-size: 1.25rem;
    }

    .table-scroll {
      overflow-x: auto;
    }

    .crew-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.92rem;
    }

    .crew-table th {
      background-color: var(--mcd-yellow-soft);
      padding: 12px 14px;
      font-family: 'Jua', sans-serif;
      font-size: 0.95rem;
      color: #875c00;
      border-bottom: 2px solid #f2dfa7;
      white-space: nowrap;
    }

    .crew-table td {
      padding: 11px 12px;
      border-bottom: 1px solid #f2eae0;
      white-space: nowrap;
    }

    .crew-table tr.weekend {
      background-color: #faf7f2;
      color: #a8a39a;
    }

    .crew-table tr.today {
      background-color: #fff9e6;
      border-left: 4px solid var(--mcd-yellow);
    }

    select, input[type="time"], input[type="number"] {
      padding: 6px 10px;
      border: 1.5px solid #d8ccc0;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      background-color: #fff;
      outline: none;
    }

    select:focus, input[type="time"]:focus, input[type="number"]:focus {
      border-color: var(--mcd-red);
      box-shadow: 0 0 0 3px rgba(218, 41, 28, 0.12);
    }

    .day-total-badge {
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      color: var(--mcd-red);
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: #9e978c;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <!-- 좌측: 로고 및 크루 닉네임 탭 -->
      <div class="header-left">
        <div class="logo-box">
          <div class="golden-arch mcd-font">M</div>
          <div class="logo-text">
            <h1>M-CREW SHIFT</h1>
            <span>선택적 시차근무 크루 타임시트 🍟</span>
          </div>
        </div>
        <!-- 팀원 닉네임 버튼 목록 -->
        <div class="crew-tabs-wrap" id="crewTabsWrap">
          <!-- 자바스크립트로 닉네임 탭들이 들어옵니다 -->
        </div>
      </div>

      <!-- 우측: 월 선택 및 상태 -->
      <div class="header-right">
        <div class="month-picker-wrap">
          <label for="monthPicker">근무 월</label>
          <input type="month" id="monthPicker">
        </div>
        <span id="syncStatus" class="sync-badge">🍟 준비 완료</span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 크루 요약 대시보드 -->
    <section class="dashboard-panel">
      <div class="target-bar">
        <label for="targetHours">🍔 <span id="currentCrewName">크루 1</span> 님의 목표 근무시간</label>
        <div class="target-input-box">
          <input type="number" id="targetHours" value="168" min="0" step="0.5">
          <span class="mcd-font" style="color:var(--mcd-red);">시간</span>
        </div>
      </div>

      <div class="metrics-grid">
        <div class="metric-card main-burger">
          <span class="metric-title">현재 누적 근무시간</span>
          <div class="metric-val"><strong id="totalWorked">0.0</strong> <span>시간</span></div>
          <p class="metric-desc">연차(+8h) / 반차(+4h) 합산 완료</p>
        </div>

        <div class="metric-card">
          <span class="metric-title">목표까지 남은 시간</span>
          <div class="metric-val"><strong id="remainingHours">0.0</strong> <span>시간</span></div>
          <p class="metric-desc" id="remainingStatus">계산 중...</p>
        </div>

        <div class="metric-card highlight-crew">
          <span class="metric-title">🍟 남은 평일 1일 권장 근무시간</span>
          <div class="metric-val"><strong id="dailyRecommended">0.0</strong> <span>시간/일</span></div>
          <p class="metric-desc" id="remainingWorkdaysText">남은 평일: 0일 기준</p>
        </div>
      </div>
    </section>

    <!-- 일별 시프트 테이블 -->
    <section class="table-panel">
      <div class="panel-head">
        <h2>📋 <span id="tableCrewName">크루 1</span> 님의 출퇴근 기록표</h2>
      </div>

      <div class="table-scroll">
        <table class="crew-table">
          <thead>
            <tr>
              <th>날짜/요일</th>
              <th>근무 구분</th>
              <th>출근 시간</th>
              <th>퇴근 시간</th>
              <th>휴게(분)</th>
              <th>당일 인정시간</th>
            </tr>
          </thead>
          <tbody id="workTableBody">
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 M-CREW SHIFT · 맥도날드 팀 시차출근 매니저</p>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
